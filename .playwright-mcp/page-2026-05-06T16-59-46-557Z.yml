            - heading "What is the first thing I should validate in an AI startup idea?" [level=3] [ref=e299]
            - paragraph [ref=e300]: Start by validating that the pain is repeated, expensive enough to matter, and narrow enough to tie to one buyer and one workflow before you worry about broad market stories.
        - article [ref=e301]:
          - generic [ref=e303]:
            - heading "How do I know whether a wedge is still too broad?" [level=3] [ref=e304]
            - paragraph [ref=e305]: If the same pitch could apply to many buyer types, many workflows, or many pains at once, the wedge is still too broad. Validation gets stronger when the context becomes easier to explain in one sentence.
        - article [ref=e306]:
          - generic [ref=e308]:
            - heading "Should I validate with ChatGPT prompts alone?" [level=3] [ref=e309]
            - paragraph [ref=e310]: Generic prompting can help surface risks, but it rarely creates a stable comparison frame. A structured workflow is more useful when you want to judge several validation signals together and leave with one next move.
        - article [ref=e311]:
