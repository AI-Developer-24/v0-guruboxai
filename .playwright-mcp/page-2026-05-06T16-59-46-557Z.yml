            - heading "When should I move from this guide into the product?" [level=3] [ref=e314]
            - paragraph [ref=e315]: Move into the product as soon as you have a direction worth pressure-testing. The guide teaches the sequence; the product helps you apply it with ranked outputs and clearer trade-offs.
